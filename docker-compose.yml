services:
  app:
    image: "${DASH_IMAGE:-farandal/dash-backend:1.0.0-core}"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_app"
    user: "0:0"
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DBI_APP_PORT:-18000}:80"
      - "${DBI_REVERB_SERVER_PORT:-16001}:6001"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      # Force pgsql driver — overrides any bootstrap/cache/config.php baked into image
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
    volumes:
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/html/.env"
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/html/.env.production"
      - "${DOMAIN_PATH:-../dash-backend-domain}:/var/www/html/domain:delegated"
      - "dash-composer-cache:/.composer"
    networks:
      - dash
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  pgsql:
    image: "postgres:17-alpine"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_pgsql"
    ports:
      - "${DBI_FORWARD_DB_PORT:-15432}:5432"
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_DB: "${DB_DATABASE:-dash}"
      POSTGRES_USER: "${DB_USERNAME:-sail}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - "dash-pgsql:/var/lib/postgresql/data"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-dash}", "-U", "${DB_USERNAME:-sail}"]
      retries: 3
      timeout: 5s

  redis:
    image: "redis:alpine"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_redis"
    ports:
      - "${DBI_FORWARD_REDIS_PORT:-16379}:6379"
    volumes:
      - "dash-redis:/data"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  mailhog:
    image: "mailhog/mailhog:latest"
    platform: linux/amd64
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_mailhog"
    ports:
      - "${DBI_FORWARD_MAILHOG_PORT:-11025}:1025"
      - "${DBI_FORWARD_MAILHOG_DASHBOARD_PORT:-18025}:8025"
    networks:
      - dash

networks:
  dash:
    driver: bridge

volumes:
  dash-pgsql:
    driver: local
  dash-redis:
    driver: local
  dash-composer-cache:
    driver: local
