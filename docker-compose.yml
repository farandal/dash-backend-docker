services:
  app:
    image: "${DASH_IMAGE:-local/dash-backend-core:latest}"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_app"
    restart: unless-stopped
    user: "0:0"
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DBI_APP_PORT:-18000}:80"
      - "${DBI_REVERB_SERVER_PORT:-26001}:${REVERB_SERVER_PORT:-6001}"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      # Core image bakes ENV APP_ENV=production; a real container env var always
      # beats whatever the mounted .env file says, so APP_ENV=local in
      # .env.<project>.local/.tunnel was silently ignored without this override.
      # This compose file is local-dev-only (real production deploys go through
      # kitchntabs-ci-cdk/ECS, not docker-compose), so "local" is a safe default.
      APP_ENV: "${APP_ENV:-local}"
      # Force pgsql driver — overrides any bootstrap/cache/config.php baked into image
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
    volumes:
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/dash/.env"
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/dash/.env.production"
      - "${DOMAIN_PATH:-../dash-backend-domain}:/var/www/dash/domain:delegated"
      # Optional, config-only mount — distinct from domain/ above (which is the whole
      # active domain's codebase). Layers multiple config sources on top of each other
      # before the active domain's own domain/config/ gets final say. No-op (empty dir)
      # unless DOMAIN_CONFIG_LAYERS_PATH is set — see domain-config-layers/README.md.
      - "${DOMAIN_CONFIG_LAYERS_PATH:-./domain-config-layers}:/var/www/dash/domain-config-layers:delegated"
      # Dev storage on the host so assets, logs, cache & sessions live on local disk
      # (not baked inside the image). Folder is named after the domain project.
      - "${STORAGE_PATH:-./storage/dash-backend-domain}:/var/www/dash/storage:delegated"
      - "dash-composer-cache:/.composer"
      - ./reports:/var/www/dash/reports
      # config/ is NOT mounted whole below, so keep these individual patched-file mounts.
      - "${BACKEND_PATH:-../dash-backend}/config/firebase.php:/var/www/dash/config/firebase.php:ro"
      - "${BACKEND_PATH:-../dash-backend}/config/broadcasting.php:/var/www/dash/config/broadcasting.php:ro"
      - "${BACKEND_PATH:-../dash-backend}/config/horizon.php:/var/www/dash/config/horizon.php:ro"
      # Carries the `ai-agents` channel that AgentUsageRecorder logs token/timing
      # accounting to. Unmounted, Log::channel('ai-agents') resolves against the
      # baked config, throws "Log [ai-agents] is not defined", and the recorder
      # swallows it — so usage silently stops being logged with nothing to see.
      - "${BACKEND_PATH:-../dash-backend}/config/logging.php:/var/www/dash/config/logging.php:ro"
      # max_request_size/max_message_size. Left baked at Reverb's 10KB default,
      # an AI turn whose tool result exceeds it is refused with a 413 and the
      # whole turn dies — the failure this raise exists to prevent.
      - "${BACKEND_PATH:-../dash-backend}/config/reverb.php:/var/www/dash/config/reverb.php:ro"
      # Carries SKIP_EMAIL_VERIFICATION (and the signup defaults). Without this
      # mount the container keeps the config/system.php baked into the image, so
      # a newly added key reads as NULL no matter what the .env says — the same
      # reason horizon.php above had to be listed individually.
      - "${BACKEND_PATH:-../dash-backend}/config/system.php:/var/www/dash/config/system.php:ro"
      # Carries the `kiosk_photos` disk (app/PhotoBoothCore). That disk is rooted
      # OUTSIDE storage/app specifically so /api/storage/{path} cannot reach a
      # souvenir photo; unmounted, Storage::disk('kiosk_photos') resolves against
      # the baked config and throws "Disk [kiosk_photos] does not have a
      # configured driver" on the first upload. Same reason horizon.php and
      # system.php above had to be listed individually.
      - "${BACKEND_PATH:-../dash-backend}/config/filesystems.php:/var/www/dash/config/filesystems.php:ro"
      - "${BACKEND_PATH:-../dash-backend}/config/app.php:/var/www/dash/config/app.php:ro"
      - "${BACKEND_PATH:-../dash-backend}/phpunit.xml:/var/www/dash/phpunit.xml:ro"
      # docker/ is NOT mounted whole below either — the entrypoint reads this nginx
      # template (via envsubst) on every container start, so edits here take effect
      # with a plain `docker compose restart app`, no image rebuild needed.
      - "${BACKEND_PATH:-../dash-backend}/docker/nginx/api.nginx.conf:/var/www/dash/docker/nginx/api.nginx.conf:ro"
      #
      # --- Optional: mount dash-backend CORE SOURCE for local development ----------
      # Edit core source on the host (../dash-backend) and changes apply live in the
      # container — no image rebuild or `docker cp` needed. Read-write so artisan
      # generators and bootstrap/cache work. Comment out this whole block to run
      # purely from the baked image. NOTE: vendor/ and config/ deliberately stay
      # baked (config/firebase.php is patched above); these supersede any per-file
      # core mounts (e.g. routes/system.php, the SystemPaymentGateway feature files).
      - "${BACKEND_PATH:-../dash-backend}/app:/var/www/dash/app:delegated"
      - "${BACKEND_PATH:-../dash-backend}/bootstrap:/var/www/dash/bootstrap:delegated"
      # PER-PROJECT, nested over the shared bootstrap/ above — and this one is
      # not optional when two domains run side by side.
      #
      # bootstrap/cache is the only READ-WRITE state in the core mount, and
      # entrypoint.sh rewrites all of it on every single container start:
      #
      #     rm -f bootstrap/cache/routes-v7.php && php artisan route:cache
      #     php artisan config:cache
      #
      # Shared, that means whichever stack booted LAST owns the route cache and
      # the config cache for BOTH. Starting kitchntabs while vanexa was up left
      # vanexa serving kitchntabs' cached routes: every /api/lab/* path 404'd at
      # once, and the log blamed a controller class that only exists in the
      # other domain. config.php is worse and quieter — it freezes the other
      # project's DB name, APP_URL and Reverb credentials into this container.
      #
      # Nesting a mount over a subdirectory of an existing mount is what keeps
      # the rest of bootstrap/ shared (app.php, providers.php) while giving each
      # project its own cache, exactly as STORAGE_PATH and DB_STORAGE_PATH
      # already do for storage and Postgres.
      - "${BOOTSTRAP_CACHE_PATH:-./storage/dash-backend-domain/bootstrap-cache}:/var/www/dash/bootstrap/cache:delegated"
      - "${BACKEND_PATH:-../dash-backend}/database:/var/www/dash/database:delegated"
      - "${BACKEND_PATH:-../dash-backend}/lang:/var/www/dash/lang:delegated"
      - "${BACKEND_PATH:-../dash-backend}/public:/var/www/dash/public:delegated"
      - "${BACKEND_PATH:-../dash-backend}/resources:/var/www/dash/resources:delegated"
      - "${BACKEND_PATH:-../dash-backend}/routes:/var/www/dash/routes:delegated"
      - "${BACKEND_PATH:-../dash-backend}/tests:/var/www/dash/tests:delegated"
      # ----------------------------------------------------------------------------
    networks:
      - dash
    depends_on:
      pgsql:
        condition: service_healthy
      pgsql_setup:
        condition: service_healthy
      redis:
        condition: service_started

  api_docs:
    image: nginx:alpine
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_api_docs"
    restart: unless-stopped
    ports:
      - "${DBI_API_DOCS_PORT:-18010}:80"
    volumes:
      - "./docs/api-docs:/usr/share/nginx/html:ro"
    depends_on:
      - app
    networks:
      - dash

  pgsql:
    image: "postgres:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_pgsql"
    restart: unless-stopped
    ports:
      - "${DBI_FORWARD_DB_PORT:-15432}:5432"
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_DB: "${DB_DATABASE:-dash}"
      POSTGRES_DB_TEST: "${DB_DATABASE_TEST:-dash_test}"
      POSTGRES_USER: "${DB_USERNAME:-sail}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      # Bind mount (not a named volume) so the DB survives `docker compose down -v`
      # and lives under this project's storage/ tree instead of Docker's opaque
      # volume storage, which a Docker Desktop reset/cleanup can wipe with no
      # `docker compose` command involved at all. Set per-project via DB_STORAGE_PATH
      # in .env.<project> (e.g. ./storage/<project>-backend-domain/pgsql-data).
      # Mounted at the /var/lib/postgresql PARENT dir, not .../data — the official
      # postgres image's real PGDATA path varies by major version (e.g. pg18 uses
      # /var/lib/postgresql/18/docker, not /var/lib/postgresql/data), so mounting
      # the parent covers whatever internal layout the image actually uses.
      - "${DB_STORAGE_PATH:-./storage/pgsql-data}:/var/lib/postgresql:delegated"
      - "${BACKEND_PATH:-../dash-backend}/database/create-testing-db.sh:/docker-entrypoint-initdb.d/10-create-testing-db.sh:ro"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-dash}", "-U", "${DB_USERNAME:-sail}"]
      retries: 3
      timeout: 5s

  pgsql_setup:
    image: "postgres:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_pgsql_setup"
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_HOST: "pgsql"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${DB_DATABASE:-dash}"
      POSTGRES_DB_TEST: "${DB_DATABASE_TEST:-dash_test}"
      POSTGRES_USER: "${DB_USERNAME:-sail}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    entrypoint:
      - /bin/sh
      - -lc
      - /docker-entrypoint-initdb.d/10-create-testing-db.sh && tail -f /dev/null
    volumes:
      - "${BACKEND_PATH:-../dash-backend}/database/create-testing-db.sh:/docker-entrypoint-initdb.d/10-create-testing-db.sh:ro"
    networks:
      - dash
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'\" | grep -q 1 && ( [ -z \"$$POSTGRES_DB_TEST\" ] || psql -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB_TEST'\" | grep -q 1 )",
        ]
      retries: 10
      timeout: 5s
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_redis"
    restart: unless-stopped
    ports:
      - "${DBI_FORWARD_REDIS_PORT:-16379}:6379"
    volumes:
      - "dash-redis:/data"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  mailhog:
    image: "mailhog/mailhog:latest"
    platform: linux/amd64
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_mailhog"
    restart: unless-stopped
    ports:
      - "${DBI_FORWARD_MAILHOG_PORT:-11025}:1025"
      - "${DBI_FORWARD_MAILHOG_DASHBOARD_PORT:-18025}:8025"
    networks:
      - dash

networks:
  dash:
    driver: bridge

volumes:
  dash-redis:
    driver: local
  dash-composer-cache:
    driver: local
