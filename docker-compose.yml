services:
  app:
    image: "${DASH_IMAGE:-local/dash-backend-core:latest}"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_app"
    user: "0:0"
    security_opt:
      - seccomp:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DBI_APP_PORT:-18000}:80"
      - "${DBI_REVERB_SERVER_PORT:-25001}:${REVERB_SERVER_PORT:-25001}"
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
      # Force pgsql driver — overrides any bootstrap/cache/config.php baked into image
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
    volumes:
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/html/.env"
      - "${ENV_FILE:-../dash-backend/.env.dash.local}:/var/www/html/.env.production"
      - "${DOMAIN_PATH:-../dash-backend-domain}:/var/www/html/domain:delegated"
      # Dev storage on the host so assets, logs, cache & sessions live on local disk
      # (not baked inside the image). Folder is named after the domain project.
      - "${STORAGE_PATH:-./storage/dash-backend-domain}:/var/www/html/storage:delegated"
      - "dash-composer-cache:/.composer"
      - ./reports:/var/www/html/reports
      # config/ is NOT mounted whole below, so keep these individual patched-file mounts.
      - "${BACKEND_PATH:-../dash-backend}/config/firebase.php:/var/www/html/config/firebase.php:ro"
      - "${BACKEND_PATH:-../dash-backend}/config/broadcasting.php:/var/www/html/config/broadcasting.php:ro"
      #
      # --- Optional: mount dash-backend CORE SOURCE for local development ----------
      # Edit core source on the host (../dash-backend) and changes apply live in the
      # container — no image rebuild or `docker cp` needed. Read-write so artisan
      # generators and bootstrap/cache work. Comment out this whole block to run
      # purely from the baked image. NOTE: vendor/ and config/ deliberately stay
      # baked (config/firebase.php is patched above); these supersede any per-file
      # core mounts (e.g. routes/system.php, the SystemPaymentGateway feature files).
      - "${BACKEND_PATH:-../dash-backend}/app:/var/www/html/app:delegated"
      - "${BACKEND_PATH:-../dash-backend}/bootstrap:/var/www/html/bootstrap:delegated"
      - "${BACKEND_PATH:-../dash-backend}/database:/var/www/html/database:delegated"
      - "${BACKEND_PATH:-../dash-backend}/lang:/var/www/html/lang:delegated"
      - "${BACKEND_PATH:-../dash-backend}/public:/var/www/html/public:delegated"
      - "${BACKEND_PATH:-../dash-backend}/resources:/var/www/html/resources:delegated"
      - "${BACKEND_PATH:-../dash-backend}/routes:/var/www/html/routes:delegated"
      - "${BACKEND_PATH:-../dash-backend}/tests:/var/www/html/tests:delegated"
      # ----------------------------------------------------------------------------
    networks:
      - dash
    depends_on:
      pgsql:
        condition: service_healthy
      pgsql_setup:
        condition: service_healthy
      redis:
        condition: service_started

  api_docs:
    image: nginx:alpine
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_api_docs"
    restart: unless-stopped
    ports:
      - "${DBI_API_DOCS_PORT:-18010}:80"
    volumes:
      - "./docs/api-docs:/usr/share/nginx/html:ro"
    depends_on:
      - app
    networks:
      - dash

  pgsql:
    image: "postgres:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_pgsql"
    ports:
      - "${DBI_FORWARD_DB_PORT:-15432}:5432"
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_DB: "${DB_DATABASE:-dash}"
      POSTGRES_DB_TEST: "${DB_DATABASE_TEST:-dash_test}"
      POSTGRES_USER: "${DB_USERNAME:-sail}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - "dash-pgsql:/var/lib/postgresql"
      - "../dash-backend/database/create-testing-db.sh:/docker-entrypoint-initdb.d/10-create-testing-db.sh:ro"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_DATABASE:-dash}", "-U", "${DB_USERNAME:-sail}"]
      retries: 3
      timeout: 5s

  pgsql_setup:
    image: "postgres:latest"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_pgsql_setup"
    depends_on:
      pgsql:
        condition: service_healthy
    environment:
      PGPASSWORD: "${DB_PASSWORD:-secret}"
      POSTGRES_HOST: "pgsql"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${DB_DATABASE:-dash}"
      POSTGRES_DB_TEST: "${DB_DATABASE_TEST:-dash_test}"
      POSTGRES_USER: "${DB_USERNAME:-sail}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    entrypoint:
      - /bin/sh
      - -lc
      - /docker-entrypoint-initdb.d/10-create-testing-db.sh && tail -f /dev/null
    volumes:
      - "../dash-backend/database/create-testing-db.sh:/docker-entrypoint-initdb.d/10-create-testing-db.sh:ro"
    networks:
      - dash
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "psql -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB'\" | grep -q 1 && ( [ -z \"$$POSTGRES_DB_TEST\" ] || psql -h $$POSTGRES_HOST -p $$POSTGRES_PORT -U $$POSTGRES_USER -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$POSTGRES_DB_TEST'\" | grep -q 1 )",
        ]
      retries: 10
      timeout: 5s
    restart: unless-stopped

  redis:
    image: "redis:alpine"
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_redis"
    ports:
      - "${DBI_FORWARD_REDIS_PORT:-16379}:6379"
    volumes:
      - "dash-redis:/data"
    networks:
      - dash
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      retries: 3
      timeout: 5s

  mailhog:
    image: "mailhog/mailhog:latest"
    platform: linux/amd64
    container_name: "${COMPOSE_PROJECT_NAME:-dash_image}_mailhog"
    ports:
      - "${DBI_FORWARD_MAILHOG_PORT:-11025}:1025"
      - "${DBI_FORWARD_MAILHOG_DASHBOARD_PORT:-18025}:8025"
    networks:
      - dash

networks:
  dash:
    driver: bridge

volumes:
  dash-pgsql:
    driver: local
  dash-redis:
    driver: local
  dash-composer-cache:
    driver: local
